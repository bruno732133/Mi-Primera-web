
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mi primera web</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #101827;
      color: white;
      text-align: center;
      padding: 40px 20px;
    }
    .tarjeta {
      background: #1e293b;
      padding: 25px;
      border-radius: 18px;
      max-width: 400px;
      margin: 30px auto;
    }
    a {
      display: inline-block;
      background: #38bdf8;
      color: #101827;
      padding: 12px 20px;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="tarjeta">
    <h1>¡Hola, mundo!</h1>
    <p>Esta es mi primera página web.</p>
    <p>Estoy aprendiendo a crear sitios web.</p>
    <a href="https://github.com/">Conocer GitHub</a>
  </div>
</body>
</html>
